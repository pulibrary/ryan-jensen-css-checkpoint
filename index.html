<!DOCTYPE html>
<html>
    <head>
        <title>Google</title>
        <link rel="stylesheet" href="styles.css"/>
    </head>
    <body>
        <header>
            <div class="header">
                <div class="about-store">
                    <a href="https://about.google/?fg=1&utm_source=google-US&utm_medium=referral&utm_campaign=hp-header" target="_blank" class="about">About</a>
                    <a href="https://store.google.com/US?utm_source=hp_header&utm_medium=google_ooo&utm_campaign=GS100042&hl=en-US" target="_blank" class="store">Store</a>
                </div>
                <div class="gmail-images">
                    <a href="https://mail.google.com/mail/?authuser=0&ogbl" target="_blank" class="images">Gmail</a>
                    <a href="https://www.google.com/imghp?hl=en&authuser=0&ogbl" target="_blank" class="images">Images</a>
                    <a href="https://www.google.com/intl/en/about/products" class="apps-grid">
                        <img src="images/grey-circle.png" class="grey-circle"/>
                        <img src="images/grey-circle.png" class="grey-circle"/>
                        <img src="images/grey-circle.png" class="grey-circle"/>
                        <img src="images/grey-circle.png" class="grey-circle"/>
                        <img src="images/grey-circle.png" class="grey-circle"/>
                        <img src="images/grey-circle.png" class="grey-circle"/>
                        <img src="images/grey-circle.png" class="grey-circle"/>
                        <img src="images/grey-circle.png" class="grey-circle"/>
                        <img src="images/grey-circle.png" class="grey-circle"/>
                    </a>
                    <a href="https://accounts.google.com/SignOutOptions?hl=en&continue=https://www.google.com/&ec=futura_exp_og_si_72776762_e">
                        <img src="images/Ryan Jensen.jpg" class="me"/>
                    </a>
                </div>
            </div>
        </header>

        <main class="container">
            <img src="images/Google.png" alt="Google logo" class="google"/>
            <div class="searchbar">
                <img src="images/Magnifying Glass.png" alt="Search icon" class="mag-glass"/>
                <input type="text" class="search" name="search" autocomplete="off" placeholder=" "/>
                <img src="images/Search X.png" alt="X out of search" class="search-x"/>
                <img src="images/Divider.png" alt="" class="divider"/>
                <img src="images/Microphone.png" alt="Search by voice" class="mic"/>
                <img src="images/Google Lens.png" alt="Search by image" class="google-lens"/>
            </div>
            <div class="buttons">
                <input type="button" class="google-search" name="google-search" value="Google Search"/>
                <input type="button" class="lucky" name="lucky" value="I'm Feeling Lucky"/>
            </div>
            <div class="youtube-rec">
                <img src="images/Youtube Logo.png" alt="" class="youtube-logo"/>
                <p class="watch">Watch! </p>
                <p class="game">Pacers vs. Thunder: </p>
                <a href="https://tv.youtube.com/welcome/?utm_campaign=ytv_atl_nba_finals_q2_2025&utm_source=hpp&utm_medium=google_homepage&utm_content=cpy2" class="game-link">The NBA Finals tip off on YouTube TV</a>
            </div>
        </main>

        <footer>
            <div class="footer">
                <div class="ad-biz-how">
                    <a href="https://www.google.com/intl/en_us/ads/?subid=ww-ww-et-g-awa-a-g_hpafoot1_1!o2&utm_source=google.com&utm_medium=referral&utm_campaign=google_hpafooter&fg=1" target="_blank" class="ad">Advertising</a>
                    <a href="https://www.google.com/services/?subid=ww-ww-et-g-awa-a-g_hpbfoot1_1!o2&utm_source=google.com&utm_medium=referral&utm_campaign=google_hpbfooter&fg=1" target="_blank" class="biz">Business</a>
                    <a href="https://google.com/search/howsearchworks/?fg=1" target="_blank" class="how">How Search works</a>
                </div>
                <div class="sci-env">
                    <img src="images/leaf.png" alt="" class="leaf"/>
                    <a href="https://policies.google.com/privacy?hl=en&fg=1" target="_blank" class="sci-env-text">Applying AI towards science and the environment</a>
                </div>
                <div class="priv-term-set">
                    <a href="https://policies.google.com/privacy?hl=en&fg=1" target="_blank" class="priv">Privacy</a>
                    <a href="https://policies.google.com/terms?hl=en&fg=1" target="_blank" class="term">Terms</a>
                    <a href="https://www.google.com/#:~:text=Terms-,Settings" target="_blank" class="set">Settings</a>
                </div>
            </div>
        </footer>
    </body>
</html>
